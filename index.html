<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sapta Kanni Amman Temple Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Tamil&family=Mukta+Malar:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: kumkum-red masthead with a toranam (hanging arch) border echoing the prabhavali, role-aware tab bar, one working panel below. English and Tamil share one layout. */
:root{
  --bg:#FFF6C9; --surface:#FFFFFF; --surface2:#FFEFA8; --field:#FFFEF5;
  --ink:#2B1710; --muted:#6A5244; --line:#E6D27A; --line2:#C9B15A;
  --kk:#B3171F; --kk-text:#B3171F; --kk-ink:#FFFFFF;
  --leaf:#1E6B3B; --nila:#1F5F8B; --gold:#D4A017;
  --mast:#7A0F17; --mast-ink:#FFF3CF; --mast-gold:#F5C84C;
  --good:#1E7A3C; --warn:#8A5200; --bad:#B3171F; --info:#1F5F8B;
  --display:"Tiro Tamil","Noto Serif Tamil",Georgia,serif;
  --body:"Mukta Malar","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A0F0D; --surface:#251715; --surface2:#31201C; --field:#1F1210;
  --ink:#F5E8CC; --muted:#C2AD92; --line:#43302A; --line2:#5C453C;
  --kk:#C2262E; --kk-text:#FF8F85; --kk-ink:#FFFFFF;
  --leaf:#55B27A; --nila:#6FB3E0; --gold:#E8B730;
  --mast:#4A0A10; --mast-ink:#FFF3CF; --mast-gold:#F5C84C;
  --good:#6FCF8B; --warn:#F0B24A; --bad:#FF8F85; --info:#7DBDE8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A0F0D; --surface:#251715; --surface2:#31201C; --field:#1F1210;
  --ink:#F5E8CC; --muted:#C2AD92; --line:#43302A; --line2:#5C453C;
  --kk:#C2262E; --kk-text:#FF8F85; --kk-ink:#FFFFFF;
  --leaf:#55B27A; --nila:#6FB3E0; --gold:#E8B730;
  --mast:#4A0A10; --mast-ink:#FFF3CF; --mast-gold:#F5C84C;
  --good:#6FCF8B; --warn:#F0B24A; --bad:#FF8F85; --info:#7DBDE8; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
html[lang="ta"] body{line-height:1.7}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--nila);outline-offset:2px}

/* masthead */
.mast{background:var(--mast);color:var(--mast-ink)}
.mast .wrap{display:flex;gap:14px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:18px;padding-bottom:14px}
.bless{font:14px/1.4 var(--display);color:var(--mast-gold)}
.mast h1{font:400 clamp(22px,4.4vw,34px)/1.2 var(--display);margin-top:2px}
.mast small{display:block;margin-top:2px;opacity:.85;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
html[lang="ta"] .mast small{letter-spacing:0;text-transform:none;font-size:14px}
.toranam{height:18px;background:
  radial-gradient(circle at 50% 0,var(--mast) 0 4px,var(--mast-gold) 4px 7px,#2E8B57 7px 10px,#3A86C8 10px 13px,#D62828 13px 16px,var(--mast) 16px) 0 0/36px 18px repeat-x,var(--mast)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who .name{font-weight:600}
.who .role{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mast-gold)}
html[lang="ta"] .who .role{letter-spacing:0;text-transform:none;font-size:13px}
.dbs{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:3px 10px;border:1px solid color-mix(in srgb,var(--mast-ink) 35%,transparent);border-radius:999px}
.dbs i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.dbs.ok i{background:#6FCF8B}.dbs.bad i{background:#FF8F85}.dbs.busy i{background:#F5C84C}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--kk);border-color:var(--kk);color:var(--kk-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{min-height:32px;padding:3px 10px;font-size:13px}
.btn.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.mast .btn{background:transparent;color:var(--mast-ink);border-color:color-mix(in srgb,var(--mast-ink) 45%,transparent)}
.mast .btn:hover{background:color-mix(in srgb,var(--mast-ink) 14%,transparent)}
.mast .btn.primary{background:var(--mast-gold);color:#3A0A0E;border-color:var(--mast-gold)}
.mast .btn.lang{border-color:var(--mast-gold);color:var(--mast-gold);font-weight:700}

/* nav + ribbon */
.ribbon{background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px}
.ribbon .wrap{padding-top:8px;padding-bottom:8px}
.nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line2);margin-top:14px;scrollbar-width:thin}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--kk-text);border-bottom-color:var(--kk);font-weight:700}
main{padding-top:20px;padding-bottom:56px;outline:none}

/* panels */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.phead h2{font:400 26px/1.25 var(--display)}
.phead p{color:var(--muted);font-size:14px;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card h3{font:400 19px/1.35 var(--display);margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block;min-height:220px}
.hero-t{padding:22px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.hero-t h2{font:400 clamp(24px,3.4vw,32px)/1.25 var(--display)}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--kk-text);font-weight:600}
html[lang="ta"] .eyebrow{letter-spacing:0;text-transform:none;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:6px;padding:12px 14px}
.stat span{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
html[lang="ta"] .stat span,html[lang="ta"] th{letter-spacing:0;text-transform:none;font-size:13px}
.stat b{display:block;font-size:26px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.stat.g{border-top-color:var(--leaf)}.stat.r{border-top-color:var(--bad)}.stat.b{border-top-color:var(--nila)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;white-space:nowrap;background:var(--surface2)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
.mono{font-family:var(--mono);font-size:13px}
tr.cancelled td:not(.act){text-decoration:line-through;color:var(--muted)}
td.act{white-space:nowrap;text-align:right}
td.act .btn{margin-left:4px}
tfoot td{font-weight:700;background:var(--surface2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sub{display:block;color:var(--muted);font-size:12px}

.pill{--c:var(--muted);display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap}
.pill.ok{--c:var(--good)}.pill.warn{--c:var(--warn)}.pill.bad{--c:var(--bad)}.pill.info{--c:var(--info)}

.bar-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar-tools input,.bar-tools select{width:auto;min-width:140px;flex:1 1 160px;max-width:280px}
input,select,textarea{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;width:100%;min-height:38px}
textarea{resize:vertical}

/* events */
.ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.dt{text-align:center;border:1px solid var(--line2);border-top:4px solid var(--kk);border-radius:4px;background:var(--surface2);padding:2px 0 4px;line-height:1.1}
.dt b{display:block;font:400 26px/1.15 var(--display)}
.dt span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
html[lang="ta"] .dt span{letter-spacing:0;text-transform:none}
.ev h3{font:400 18px/1.4 var(--display);margin:0 0 2px}
.ev p{color:var(--muted);font-size:14px}
.ev.past{opacity:.72}
.ev .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;align-items:center}
.ev .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* members */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.mem{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mem h3{font:400 19px/1.4 var(--display)}
.mem p{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.mem .acts{margin-top:auto;padding-top:8px}

/* charts */
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.m{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.pair{display:flex;align-items:flex-end;gap:2px;height:150px;width:100%;justify-content:center;border-bottom:1px solid var(--line2)}
.bar{flex:1;max-width:14px;border-radius:2px 2px 0 0;min-height:0}
.bar.in{background:var(--leaf)}.bar.out{background:var(--bad)}
.m span{font-size:11px;color:var(--muted);white-space:nowrap}
.hrow{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;margin-top:6px}
.track{height:10px;background:var(--surface2);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--bad)}

/* dialogs */
dialog{border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(20,8,6,.6)}
dialog.wide{width:min(720px,calc(100% - 24px))}
.dlg-h{padding:16px 18px 0}.dlg-h h3{font:400 21px/1.35 var(--display)}
.dlg-b{padding:14px 18px;overflow:auto;max-height:70vh}
.dlg-f{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:13px;font-weight:600;color:var(--muted)}
.full{grid-column:1/-1}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
details{margin-top:8px;font-size:13px;color:var(--muted)}
summary{cursor:pointer}
code,pre{font-family:var(--mono);font-size:12.5px}
pre{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;margin:8px 0 0}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--ink);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.sec{margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:99;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding-top:14px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* receipt: a paper object, bilingual, stays light in both themes */
.rcpt{background:#fff;color:#2b1710;border:3px double #b3171f;padding:22px 24px;font-family:var(--body);max-width:640px;margin:0 auto;line-height:1.55}
.rc-head{text-align:center;border-bottom:2px solid #d4a017;padding-bottom:10px}
.rc-bless{font:14px var(--display);color:#1e6b3b}
.rc-head h3{font:400 24px/1.3 var(--display);margin:2px 0 0;color:#7a0f17}
.rc-head h4{font:400 20px/1.4 var(--display);margin:0;color:#7a0f17}
.rc-head div{font-size:13px}
.rc-title{text-align:center;font-weight:700;font-size:14px;margin:12px 0}
.rc-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:10px}
.rc-amt{font:700 30px/1.2 var(--body);border:2px solid #2b1710;display:inline-block;padding:2px 16px;margin:6px 0;font-variant-numeric:tabular-nums}
.rc-words{font-style:italic;margin-bottom:4px;font-size:14px}
.rc-tbl{width:100%;font-size:14px;border-collapse:collapse;margin:8px 0}
.rc-tbl td{border-top:1px solid #e6d27a;padding:6px 4px;color:#2b1710}
.rc-tbl td:first-child{width:38%;color:#6a5244}
.rc-sign{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:36px;font-size:13px}
.rc-sign .line{border-top:1px solid #2b1710;padding-top:4px;min-width:190px;text-align:center}
.rc-note{font-size:12px;margin-top:12px;color:#6a5244}
.rc-foot{text-align:center;font-size:12px;margin-top:12px;color:#6a5244;border-top:2px solid #d4a017;padding-top:8px}
#printArea{display:none}
[hidden]{display:none!important}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sw{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:8px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);cursor:pointer;min-width:0}
.sw[aria-pressed="true"]{outline:3px solid var(--kk);outline-offset:1px}
.sw .dots{display:flex;border-radius:4px;overflow:hidden;width:100%;height:22px;border:1px solid var(--line)}
.sw .dots i{flex:1}
.sw span{font-size:13px;line-height:1.3}
.fprev{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:12px}
.fprev b{display:block;font:400 22px/1.45 var(--display)}
.fprev span{font-size:15px}
.upibox{border:1px dashed var(--line2);border-radius:6px;padding:10px;background:var(--surface2)}
.upibox .note{margin:8px 0 0}
.embed{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:var(--surface2);display:block}
.embed.map{aspect-ratio:4/3}
.mgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.cam{width:100%;max-height:60vh;background:#000;border-radius:6px;display:block}
.flinks{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:6px}
.flinks a,.linkbtns a{color:var(--kk-text)}
.linkbtns{display:flex;gap:8px;flex-wrap:wrap}
.linkbtns a.btn{color:var(--ink);text-decoration:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:8mm}
  body{background:#fff}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .hero img{min-height:0;max-height:260px}
  .fields{grid-template-columns:1fr}
  .ev{grid-template-columns:56px minmax(0,1fr)}
  .ev .side{grid-column:1/-1;flex-direction:row;justify-content:flex-start;flex-wrap:wrap}
  .hrow{grid-template-columns:100px minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div>
      <div class="bless" id="bless"></div>
      <h1 id="tname"></h1>
      <small data-i="app.sub">Temple committee portal</small>
    </div>
    <div class="who" id="who"></div>
  </div>
  <div class="toranam" aria-hidden="true"></div>
</header>
<div id="ribbon"></div>
<div class="wrap">
  <nav id="nav" class="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
  <footer id="foot"></footer>
</div>

<dialog id="login">
  <form id="loginf">
    <div class="dlg-h"><h3 data-i="btn.signin">Sign in</h3></div>
    <div class="dlg-b">
      <div class="fields">
        <label class="fld full"><span data-i="f.username">Username</span><input id="lu" autocomplete="username" required></label>
        <label class="fld full"><span data-i="f.password">Password</span><input id="lp" type="password" autocomplete="current-password" required></label>
      </div>
      <p class="err" id="loginErr" role="alert"></p>
      <details><summary data-i="au.first">First-time default logins</summary>
        <p class="note" data-i="au.note">Change these under Admin once you are signed in as admin.</p>
        <pre>president / president@123
secretary / secretary@123
treasurer / treasurer@123
admin     / admin@123</pre>
      </details>
    </div>
    <div class="dlg-f"><button type="button" class="btn" data-act="closedlg" data-t="login" data-i="btn.cancel">Cancel</button><button class="btn primary" data-i="btn.signin">Sign in</button></div>
  </form>
</dialog>

<dialog id="dlg">
  <form id="dlgf">
    <div class="dlg-h"><h3 id="dlg-t"></h3></div>
    <div class="dlg-b"><div class="fields" id="dlg-fields"></div><p class="err" id="dlgErr" role="alert"></p></div>
    <div class="dlg-f"><button type="button" class="btn" data-act="closedlg" data-t="dlg" data-i="btn.cancel">Cancel</button><button class="btn primary" id="dlg-ok">Save</button></div>
  </form>
</dialog>

<dialog id="pwd">
  <form id="pwf">
    <div class="dlg-h"><h3 id="pw-t"></h3></div>
    <div class="dlg-b"><div class="fields">
      <label class="fld full"><span data-i="pw.new">New password (6 or more characters)</span><input id="pw1" type="password" autocomplete="new-password" required minlength="6"></label>
      <label class="fld full"><span data-i="pw.rep">Repeat new password</span><input id="pw2" type="password" autocomplete="new-password" required minlength="6"></label>
    </div><p class="err" id="pwErr" role="alert"></p></div>
    <div class="dlg-f"><button type="button" class="btn" data-act="closedlg" data-t="pwd" data-i="btn.cancel">Cancel</button><button class="btn primary" data-i="pw.save">Save password</button></div>
  </form>
</dialog>

<dialog id="rcpt" class="wide">
  <div class="dlg-b" id="rcpt-body"></div>
  <div class="dlg-f">
    <button class="btn" data-act="closedlg" data-t="rcpt" data-i="btn.close">Close</button>
    <button class="btn" data-act="copyrcpt" data-i="r.copy">Copy as text</button>
    <button class="btn primary" data-act="printrcpt" data-i="r.print">Print receipt</button>

const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const two=n=>n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');
const three=n=>{const h=Math.floor(n/100),r=n%100;return (h?ONES[h]+' Hundred'+(r?' ':''):'')+(r?two(r):'')};
function words(n){
  if(n===0)return 'Zero';
  const p=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)p.push(words(cr)+' Crore');if(lk)p.push(two(lk)+' Lakh');if(th)p.push(two(th)+' Thousand');if(n)p.push(three(n));
  return p.join(' ');
}
function rupeesInWords(a){
  const r=Math.floor(a+1e-9),p=Math.round((a-r)*100);
  return 'Rupees '+words(r)+(p?' and '+two(p)+' Paise':'')+' Only';
}

function tB100(n){if(n<10)return T_U[n];if(n<20)return T_1X[n-10];const d=T_TENS[Math.floor(n/10)],u=n%10;return u?tJoin(d[1],d[2],T_U[u]):d[0]}
function tB1000(n){const h=Math.floor(n/100),r=n%100;if(!h)return tB100(r);if(!r)return T_H[h][0];return tJoin(T_H[h][1],h===9?'த':'ற',tB100(r))}
function tThou(t,more){const w=T_TH[t]||tB100(t)+' ஆயிரம்';return more?w.slice(0,-2)+'த்து':w}
function taWords(n){
  if(n===0)return 'பூஜ்ஜியம்';
  const cr=Math.floor(n/1e7),lk=Math.floor(n%1e7/1e5),th=Math.floor(n%1e5/1e3),rest=n%1e3,p=[];
  if(cr)p.push((cr===1?'ஒரு':taWords(cr))+(n%1e7?' கோடியே':' கோடி'));
  if(lk)p.push((lk===1?'ஒரு':tB100(lk))+(n%1e5?' இலட்சத்து':' இலட்சம்'));
  if(th)p.push(tThou(th,rest>0));
  if(rest)p.push(tB1000(rest));
  return p.join(' ');
}
function rupeesInWordsTa(a){
  const r=Math.floor(a+1e-9),p=Math.round((a-r)*100);
  return 'ரூபாய் '+taWords(r)+(p?' மற்றும் '+tB100(p)+' பைசா':'')+' மட்டும்';
}

async function hashes(pw,salt){
  const s=salt+':'+pw,out=[];
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));out.push([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))}}catch(e){}
  let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;out.push('x'+(h>>>0).toString(16));
  return out;
}

/* ---------- persistence: browser cache + Turso over HTTP ---------- */
function persistLocal(){try{localStorage.setItem(LS_DB,JSON.stringify(DB))}catch(e){}}
function readLocal(){try{const x=JSON.parse(localStorage.getItem(LS_DB)||'null');return x&&x.settings?x:null}catch(e){return null}}
function tursoCfg(){
  let c=null;try{c=JSON.parse(localStorage.getItem(LS_CFG)||'null')}catch(e){}
  if(c&&c.url&&c.token)return c;
  if(TURSO_URL&&TURSO_READ_TOKEN)return {url:TURSO_URL,token:TURSO_READ_TOKEN,readonly:true};
  return null;
}
async function tursoRun(cfg,stmts){
  const base=cfg.url.trim().replace(/^libsql:\/\//,'https://').replace(/\/+$/,'');
  const reqs=stmts.map(s=>({type:'execute',stmt:{sql:s.sql,args:(s.args||[]).map(a=>({type:'text',value:String(a)}))}}));
  reqs.push({type:'close'});
  const r=await fetch(base+'/v2/pipeline',{method:'POST',headers:{'Authorization':'Bearer '+cfg.token,'Content-Type':'application/json'},body:JSON.stringify({requests:reqs})});
  if(!r.ok)throw new Error('Turso responded '+r.status);
  const j=await r.json();
  return j.results.filter(x=>x.type!=='close'&&(x.type==='error'||x.response)).map(x=>{if(x.type==='error')throw new Error(x.error.message);return x.response.result||{}});
}
const upsert=(c,r)=>({sql:'INSERT OR REPLACE INTO '+c+'(id,data,updated_at) VALUES(?,?,datetime(\'now\'))',args:[r.id,JSON.stringify(r)]});
const rowsOf=res=>(res.rows||[]).map(r=>JSON.parse(r[1].value));
function setSync(mode,key){sync={mode,key};renderChrome()}
async function pushAll(cfg){
  const st=[];COLS.forEach(c=>DB[c].forEach(r=>st.push(upsert(c,r))));
  DB.donations.forEach(d=>{if(d.utr)st.push({sql:'INSERT OR IGNORE INTO utr_index(utr,donation_id) VALUES(?,?)',args:[d.utr,d.id]})});
  for(let i=0;i<st.length;i+=40)await tursoRun(cfg,st.slice(i,i+40));
}

  setSync('busy','sy.conn');
  try{
    const cols=user?COLS:PUBLIC;const st=[];
    if(!cfg.readonly)COLS.forEach(c=>st.push({sql:'CREATE TABLE IF NOT EXISTS '+c+'(id TEXT PRIMARY KEY, data TEXT NOT NULL, updated_at TEXT DEFAULT CURRENT_TIMESTAMP)'}));

  const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.drawImage(cv,x0,y0,w,h,m,m,iw,ih);
  const im=x.getImageData(m,m,iw,ih),d=im.data;let sum=0;
  for(let i=0;i<d.length;i+=4)sum+=(d[i]+d[i+1]+d[i+2])/3;
  if(sum/(iw*ih)<128){for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2]}x.putImageData(im,m,m)}
  return c;
}
/* ---- OCR worker (reused between scans) ---- */
let ocrW=null,ocrLog=null;
async function getWorker(){
  if(!ocrW)ocrW=await Tesseract.createWorker('eng',1,{logger:m=>{if(ocrLog&&m.status==='recognizing text')ocrLog(m.progress)}});
  return ocrW;
}
async function ocrRun(w,cv,psm,whitelist){
  await w.setParameters({tessedit_pageseg_mode:String(psm),tessedit_char_whitelist:whitelist||'',preserve_interword_spaces:'1'});
  return (await w.recognize(cv)).data;
}
const upiMsg=s=>{const e=$('#upiMsg');if(e)e.textContent=s};
async function scanFile(file){
  if(!file)return;
  upiMsg(T('upi.loadocr'));
  let canvas;
  try{canvas=await imageToCanvas(file)}catch(e){upiMsg(T('upi.badimg'));return}
  await scanCanvas(canvas);
}
async function scanCanvas(raw){
  try{await setShot(raw)}catch(e){console.warn(e)}
  try{await loadOcr()}catch(e){upiMsg(T('upi.ocrfail'));return}
  try{
    const w=await getWorker();let items=[],texts=[],step=0,total=3;
    const run=async inv=>{
      const p=prep(raw,inv);
      for(const psm of [11,3]){
        step++;ocrLog=pr=>upiMsg(T('upi.pass',{n:step,t:total,p:Math.round(pr*100)}));
        const d=await ocrRun(w,p.canvas,psm);
        texts.push(String(d.text||''));items.push(...collectAmts(d,psm+(p.inv?'i':'n'),p.canvas));
      }
      return p.inv;
    };
    const inv=await run(null);
    let ranked=rankAmts(items);
    if(!ranked.length){total=5;await run(!inv);ranked=rankAmts(items)}
    /* second look at the biggest number: crop it, enlarge it, read digits only */
    if(ranked.length&&ranked[0].item.bb&&ranked[0].item.cv){
      const top=ranked[0],bb=top.item.bb,hh=bb.y1-bb.y0;
      step=total;ocrLog=pr=>upiMsg(T('upi.pass',{n:total,t:total,p:Math.round(pr*100)}));
      try{
        const d=await ocrRun(w,cropBox(top.item.cv,bb,Math.max(6,hh*.25),Math.max(6,hh*.2)),7,'0123456789,.');
        const f=String(d.text||'').replace(/\s+/g,''),rv=toValue(f.replace(/^[,.]+|[,.]+$/g,''));
        if(rv&&rv>0&&rv<1e8){
          if(rv===top.v)top.score+=2;
          else{const ex=ranked.find(e=>e.v===rv);if(ex)ex.score=Math.max(ex.score,top.score)+1;else ranked.push({v:rv,str:String(rv),score:top.score+1,item:top.item,seen:new Set()});}
        }
      }catch(e){console.warn(e)}
      ranked.sort((a,b)=>b.score-a.score);
      /* the rupee sign is often read as a 2 or 7 in front of the real amount: offer the version without it */
      const t0=ranked[0];
      if(/^[27]\d{2,}$/.test(t0.str.split('.')[0])&&!t0.str.includes('.')){
        const rest=+t0.str.slice(1);
        if(rest>0&&!ranked.some(e=>e.v===rest)){
          const confirmed=items.some(it=>it.v===rest&&!(it.tag+':'+it.li===t0.item.tag+':'+t0.item.li));
          ranked.push({v:rest,str:String(rest),score:t0.score+(confirmed?3:-1),item:t0.item,seen:new Set()});
          ranked.sort((a,b)=>b.score-a.score);
        }
      }
    }
    const best=ranked[0]||null,amount=best?+best.v.toFixed(2):null;
    const cands=[];texts.forEach(t=>utrCands(t).forEach(c=>{if(!cands.some(x=>x.utr===c.utr))cands.push(c)}));
    const mdv=($('#f_mode')||{}).value;
    if(!cands.length&&mdv!=='UPI'){const u=parseUtr(texts.join('\n'));if(u)cands.push({utr:u,why:''})}
    const utr=cands.length?cands[0].utr:null;
    SHOT_AMTS=ranked.slice(0,4).map(e=>+e.v.toFixed(2));
    const af=$('#f_amount');
    if(af&&amount!==null&&(!(+af.value>0)||af.dataset.auto==='1')){af.value=amount;af.dataset.auto='1';af.dispatchEvent(new Event('change'))}
    if(utr){const u=$('#f_utr');if(u){u.value=utr;utrHint()}}
    const md=$('#f_mode');if(md&&md.value!=='Bank transfer'&&md.value!=='UPI'){md.value='UPI';syncMode()}
    const alt=$('#upiAlt');if(alt){alt.hidden=true;alt.innerHTML=''}
    showScanResult(cands);
    const sset=S(),hay=texts.join(' ').toLowerCase().replace(/[^a-z0-9@.]/g,'');
    const idp=(sset.upiId||'').toLowerCase().split('@')[0].replace(/[^a-z0-9]/g,'');
    const nm=(sset.upiName||'').toLowerCase().split(/[^a-z]+/).filter(x=>x.length>=4);
    let ben='';
    if(idp.length>=3||nm.length){
      const ok=(idp.length>=3&&hay.replace(/[.]/g,'').includes(idp))||(nm.length&&nm.filter(x=>hay.includes(x)).length>=Math.min(2,nm.length));
      ben=' '+T(ok?'upi.benok':'upi.benbad');
    }
    upiMsg((amount!==null||utr?'':T('upi.none'))+ben);
  }catch(e){console.warn(e);upiMsg(T('upi.ocrfail'))}
}

/* does this UTR already exist? this device first, then the online database */
async function utrExists(utr,selfId){
  const own=DB.donations.find(x=>x.id!==selfId&&x.utr&&x.utr===utr);
  if(own)return {dup:true,no:own.receiptNo};
  const cfg=tursoCfg();if(!cfg)return {dup:false};
  try{
    const r=await tursoRun(cfg,[{sql:'SELECT donation_id FROM utr_index WHERE utr=? LIMIT 1',args:[utr]}]);
    const rows=(r[0]&&r[0].rows)||[];
    if(rows.length&&(rows[0][0].value!==selfId))return {dup:true,no:''};
  }catch(e){if(/no such table/i.test(e.message))return {dup:false};return {dup:false,unver:e.message}}
  return {dup:false};
}
async function utrHint(){
  const el=$('#utrDup'),m=$('#f_mode'),f=$('#f_utr');if(!el||!m||!f)return;

}

async function camAuto(stream){
  const st=$('#camSt');if(st)st.textContent=T('upi.cammsg');
  try{await loadOcr();const w=await getWorker();
    await new Promise(r=>setTimeout(r,900));let i=0;

      const v=$('#camv');if(!v||!v.videoWidth){await new Promise(r=>setTimeout(r,400));continue}
      const raw=document.createElement('canvas'),k=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));
      raw.width=Math.round(v.videoWidth*k);raw.height=Math.round(v.videoHeight*k);raw.getContext('2d').drawImage(v,0,0,raw.width,raw.height);
      if(st)st.textContent=T('upi.scanning');
      ocrLog=null;

      if(camStream!==stream)return;
      if(utrCands(d.text).length){$('#cam').close();await scanCanvas(raw);return}
      await new Promise(r=>setTimeout(r,400));

/* reserve the UTR in Turso (a primary key makes duplicates impossible even across devices) */
async function claimUtr(rec,old){
  const cfg=tursoCfg();if(!cfg||cfg.readonly)return true;
  const st=[];
  if(old&&old.utr&&old.utr!==rec.utr)st.push({sql:'DELETE FROM utr_index WHERE utr=? AND donation_id=?',args:[old.utr,rec.id]});
  if(rec.utr&&!(old&&old.utr===rec.utr))st.push({sql:'INSERT INTO utr_index(utr,donation_id) VALUES(?,?)',args:[rec.utr,rec.id]});
  if(!st.length)return true;
  try{await tursoRun(cfg,st);return true}
  catch(e){if(/UNIQUE|constraint|PRIMARY/i.test(e.message)){$('#dlgErr').textContent=T('upi.dup2');return false}
    console.warn(e);toast(T('toast.netfail'));return true}
}

/* ---------- aggregates ---------- */
function agg(f){
  const r={inn:Array(12).fill(0),out:Array(12).fill(0),inT:0,outT:0,pend:0,pendN:0,rej:0,cats:{}};
  DB.donations.forEach(d=>{if(d.cancelled||fy(d.date)!==f)return;r.inn[mi(d.date)]+=+d.amount;r.inT+=+d.amount});
  DB.expenses.forEach(x=>{
    if(fy(x.date)!==f)return;
    if(x.status==='Approved'){r.out[mi(x.date)]+=+x.amount;r.outT+=+x.amount;r.cats[x.cat]=(r.cats[x.cat]||0)+ +x.amount}
    else if(x.status==='Pending'){r.pend+=+x.amount;r.pendN++}else r.rej++;
  });
  return r;
}

    h+='<div class="card sec"><h3>'+T('us.title')+'</h3><div class="tablewrap" style="border:0"><table><thead><tr><th>'+T('th.name')+'</th><th>'+T('th.user')+'</th><th>'+T('th.role')+'</th><th></th></tr></thead><tbody>'+DB.users.map(u=>'<tr><td>'+esc(u.name)+(u.defaultPw?'<span class="sub">'+T('us.default')+'</span>':'')+'</td><td class="mono">'+esc(u.username)+'</td><td>'+pill(tv(ROLE_LABEL[u.role]||u.role),u.disabled?'bad':'info')+(u.disabled?' '+pill(T('us.disabled'),'bad'):'')+'</td><td class="act">'+b(T('btn.setpw'),'pw',{id:u.id},'sm')+(u.id!==user.id?b(T(u.disabled?'btn.enable':'btn.disable'),'toggleuser',{id:u.id},'sm')+b(T('btn.remove'),'rmuser',{id:u.id},'sm bad'):'')+'</td></tr>').join('')+'</tbody></table></div>'+
      '<form id="userf" style="margin-top:14px"><div class="fields"><label class="fld"><span>'+T('f.fullname')+'</span><input name="name" required></label><label class="fld"><span>'+T('th.user')+'</span><input name="username" required autocomplete="off"></label><label class="fld"><span>'+T('th.role')+'</span><select name="role">'+['president','secretary','treasurer','admin'].map(r=>'<option value="'+r+'">'+esc(tv(ROLE_LABEL[r]))+'</option>').join('')+'</select></label><label class="fld"><span>'+T('f.pw6')+'</span><input name="password" type="password" required minlength="6" autocomplete="new-password"></label></div><p class="err" id="userErr" role="alert"></p><div class="acts"><button class="btn">'+T('btn.adduser')+'</button></div></form></div>';
    h+='<div class="card sec"><h3>'+T('bk.title')+'</h3><p class="note" style="margin:0 0 10px">'+T('bk.note')+'</p><div class="acts">'+b(T('bk.dl'),'export',{})+(cfg?'':b(T('bk.reset'),'reset',{},'bad'))+'</div></div>';
    return h;
  }
};

/* table bodies, refreshed without losing search focus */
PANELS.events.tbl=function(){
  const t=todayISO();let l=DB.events.filter(e=>view.ev==='all'||(view.ev==='upcoming'?e.date>=t:e.date<t));
  l.sort((a,c)=>view.ev==='past'?c.date.localeCompare(a.date):a.date.localeCompare(c.date));
  return l.length?l.map(evRow).join(''):empty(T('ev.none'));
};
PANELS.donations.tbl=function(){
  const q=view.q.toLowerCase();
  const l=DB.donations.filter(d=>fy(d.date)===view.fy&&(!q||[d.donor,d.receiptNo,d.purpose,tv(d.purpose),d.mode,tv(d.mode)].join(' ').toLowerCase().includes(q))).sort((a,c)=>c.date.localeCompare(a.date)||c.receiptNo.localeCompare(a.receiptNo));
  if(!l.length)return empty(T('don.nofy'));
  const tot=l.filter(d=>!d.cancelled).reduce((s,d)=>s+ +d.amount,0);
  return '<table><thead><tr><th>'+T('th.rno')+'</th><th>'+T('th.date')+'</th><th>'+T('th.donor')+'</th><th>'+T('th.towards')+'</th><th>'+T('th.mode')+'</th><th class="num">'+T('th.amount')+'</th><th></th></tr></thead><tbody>'+
    l.map(d=>'<tr class="'+(d.cancelled?'cancelled':'')+'"><td class="mono">'+esc(d.receiptNo)+(d.utr?'<span class="sub">UTR '+esc(d.utr)+'</span>':'')+'</td><td>'+fmtDate(d.date)+'</td><td>'+esc(tv(d.donor))+'</td><td>'+esc(tv(d.purpose))+(d.cancelled?' '+pill(T('don.cancelled'),'bad'):'')+'</td><td>'+esc(tv(d.mode))+'</td><td class="num">'+inr(d.amount)+'</td><td class="act">'+b(T('btn.receipt'),'receipt',{id:d.id},'sm')+(d.hasShot?b(T('upi.proof'),'proof',{id:d.id},'sm'):'')+(can('donations','edit')&&!d.cancelled?b(T('btn.edit'),'edit',{col:'donations',id:d.id},'sm')+b(T('btn.cancelrc'),'cancelrcpt',{id:d.id},'sm bad'):'')+'</td></tr>').join('')+
    '</tbody><tfoot><tr><td colspan="5">'+T('don.tot')+'</td><td class="num">'+inr(tot)+'</td><td></td></tr></tfoot></table>';
};
PANELS.trustees.tbl=function(){
  const l=[...DB.trustees].sort((a,c)=>(a.status===c.status?0:a.status==='Active'?-1:1)||a.name.localeCompare(c.name));
  if(!l.length)return empty(T('tr.none'));
  return '<table><thead><tr><th>'+T('th.name')+'</th><th>'+T('th.desig')+'</th><th>'+T('th.appt')+'</th><th>'+T('th.termend')+'</th><th>'+T('th.status')+'</th><th></th></tr></thead><tbody>'+l.map(t=>{const s=trusteeState(t);
    return '<tr><td>'+esc(loc(t,'name'))+'<span class="sub">'+(user?esc(t.phone||''):'')+'</span></td><td>'+esc(tv(t.designation))+'</td><td>'+fmtDate(t.since)+'</td><td>'+fmtDate(t.termEnd)+'</td><td>'+pill(s[0],s[1])+'</td><td class="act">'+(can('trustees','edit')?b(T('btn.edit'),'edit',{col:'trustees',id:t.id},'sm')+(t.status==='Active'?b(T('btn.retire'),'retire',{id:t.id},'sm'):'')+b(T('btn.delete'),'delrec',{col:'trustees',id:t.id},'sm bad'):'')+'</td></tr>'}).join('')+'</tbody></table>';
};
PANELS.expenses.tbl=function(){
  const q=view.q.toLowerCase();
  const l=DB.expenses.filter(x=>fy(x.date)===view.fy&&(view.st==='all'||x.status===view.st)&&(!q||[x.payee,x.cat,tv(x.cat),x.bill].join(' ').toLowerCase().includes(q))).sort((a,c)=>c.date.localeCompare(a.date));
  if(!l.length)return empty(T('ex.none'));
  const tot=l.filter(x=>x.status==='Approved').reduce((s,x)=>s+ +x.amount,0);
  const sc={Pending:'warn',Approved:'ok',Rejected:'bad'};
  return '<table><thead><tr><th>'+T('th.date')+'</th><th>'+T('th.cat')+'</th><th>'+T('th.payee')+'</th><th class="num">'+T('th.amount')+'</th><th>'+T('th.status')+'</th><th></th></tr></thead><tbody>'+l.map(x=>{
    const ed=can('expenses','edit')&&(role()==='admin'||x.status==='Pending');
    return '<tr><td>'+fmtDate(x.date)+'</td><td>'+esc(tv(x.cat))+'</td><td>'+esc(x.payee)+'<span class="sub">'+(x.bill?T('ex.bill',{n:esc(x.bill)})+' · ':'')+T('ex.addedby',{n:esc(x.addedBy||'')})+'</span></td><td class="num">'+inr(x.amount)+'</td><td>'+pill(tv(x.status),sc[x.status])+(x.by&&x.status!=='Pending'?'<span class="sub">'+T('ex.by',{n:esc(x.by)})+'</span>':'')+'</td><td class="act">'+
      (can('expenses','approve')&&x.status==='Pending'?b(T('btn.approve'),'approve',{id:x.id},'sm good')+b(T('btn.reject'),'reject',{id:x.id},'sm bad'):'')+(ed?b(T('btn.edit'),'edit',{col:'expenses',id:x.id},'sm')+b(T('btn.delete'),'delrec',{col:'expenses',id:x.id},'sm bad'):'')+'</td></tr>'}).join('')+
    '</tbody><tfoot><tr><td colspan="3">'+T('ex.total')+'</td><td class="num">'+inr(tot)+'</td><td colspan="2"></td></tr></tfoot></table>';
};

/* ---------- render ---------- */
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=T(e.dataset.i)});
  $('#nav').setAttribute('aria-label',T('nav.aria'));
}
function renderChrome(){
  const s=DB.settings&&DB.settings[0];if(!s)return;
  applyStatic();applyAppearance();
  $('#bless').textContent=s.blessing;$('#tname').textContent=loc(s,'name');document.title=loc(s,'name')+(LANG==='ta'?' தளம்':' Portal');
  const lab={ok:T('db.ok'),busy:T('db.busy'),bad:T('db.bad'),local:T('db.local')}[sync.mode];
  $('#who').innerHTML='<span class="dbs '+sync.mode+'" title="'+esc(syncMsg())+'"><i></i>'+esc(lab)+'</span>'+
    (user?'<div><div class="name">'+esc(user.name)+'</div><div class="role">'+esc(tv(ROLE_LABEL[user.role]))+'</div></div>'+b(T('btn.password'),'pw',{id:user.id})+b(T('btn.signout'),'logout',{}):'<div><div class="name">'+T('guest')+'</div><div class="role">'+T('viewonly')+'</div></div>'+b(T('btn.signin'),'login',{},'primary'))+
    '<button class="btn" data-act="theme" aria-label="'+esc(T('btn.theme'))+'">'+T('btn.theme')+'</button><button class="btn lang" data-act="lang" lang="'+(LANG==='ta'?'en':'ta')+'">'+(LANG==='ta'?'English':'தமிழ்')+'</button>';
  $('#nav').innerHTML=TABS.filter(tabOk).map(x=>'<button data-act="tab" data-t="'+x[0]+'"'+(x[0]===tab?' aria-current="page"':'')+'>'+T('tab.'+x[0])+'</button>').join('');
  $('#ribbon').innerHTML=sync.mode==='local'?'<div class="ribbon"><div class="wrap">'+T('ribbon')+'</div></div>':'';
  $('#foot').innerHTML=esc(loc(s,'name')+' · '+T(sync.mode==='ok'?'foot.turso':'foot.local'))+footLinks();
}
function render(){
  if(!TABS.some(x=>x[0]===tab&&tabOk(x)))tab='home';
  renderChrome();$('#main').innerHTML=PANELS[tab]();
}
const refreshTable=()=>{const t=$('#tbl');if(t)t.innerHTML=PANELS[tab].tbl()};

/* ---------- actions ---------- */
const ACT={
  tab(d){tab=d.t;view.q='';render();window.scrollTo(0,0)},
  login(){$('#loginErr').textContent='';$('#loginf').reset();$('#login').showModal();setTimeout(()=>$('#lu').focus(),30)},
  logout(){user=null;try{sessionStorage.removeItem(LS_SES)}catch(e){}tab='home';render();toast(T('toast.signedout'))},
  closedlg(d){$('#'+d.t).close()},
  upipick(){const f=$('#upiFile');if(f)f.click()},
  upicam(){openCamera()},
  async rmupiqr(){const s=Object.assign({},S());delete s.upiQr;await put('settings',s);render();toast(T('toast.applied'))},
  pickamt(d){const a=$('#f_amount');if(a){a.value=d.v;a.dataset.auto='1';a.dispatchEvent(new Event('change'))}amtRefresh()},
  pickutr(d){const u=$('#f_utr');if(u){u.value=d.v;utrHint()}const r=$('#resUtr');if(r){r.style.color='var(--ok,#1b7a3a)';r.textContent='✔ UTR '+d.v}},
  showpayqr(){showPayQr()},
  shotclear(){shotReset()},
  async proof(d){let b=null;try{b=await proofGet(d.id)}catch(e){}if(!b){toast(T('upi.noproof'));return}const u=URL.createObjectURL(b);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)},
  camshot(){captureCamera()},
  lang(){LANG=LANG==='ta'?'en':'ta';try{localStorage.setItem(LS_LANG,LANG)}catch(e){}render()},
  theme(){const th=effectiveTheme(),dark=th?th.mode==='dark':(document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches);try{localStorage.setItem(LS_THEME,dark?'light':'dark')}catch(e){}applyAppearance()},
  async settheme(d){const s=Object.assign({},S());s.themeId=d.id;await put('settings',s);render();toast(T('toast.applied'))},
  newrec(d){openForm(d.col)},
  edit(d){openForm(d.col,d.id)},
  async delrec(d){
    const r=DB[d.col].find(x=>x.id===d.id);if(!r||!can(d.col,'edit'))return;
    if(await ask(T('frm.delconf',{n:loc(r,'name')||loc(r,'title')||loc(r,'label')||r.payee}),T('btn.delete'))){await del(d.col,d.id);render();toast(T('toast.deleted'))}
  },
  receipt(d){showReceipt(d.id)},
  async cancelrcpt(d){
    const r=DB.donations.find(x=>x.id===d.id);
    if(r&&await ask(T('don.cancelconf',{n:r.receiptNo}),T('btn.cancelrc2'))){r.cancelled=true;await put('donations',r);render();toast(T('toast.rccancel'))}
  },
  printrcpt(){const d=DB.donations.find(x=>x.id===view.rcpt);if(!d)return;$('#printArea').innerHTML=receiptHtml(d);window.print()},
  copyrcpt(){const d=DB.donations.find(x=>x.id===view.rcpt);if(d)copyText(receiptText(d))},
  copyev(d){const e=DB.events.find(x=>x.id===d.id);if(e)copyText(notice(e))},
  async approve(d){const x=DB.expenses.find(y=>y.id===d.id);if(!x||!can('expenses','approve'))return;x.status='Approved';x.by=user.name;await put('expenses',x);render();toast(T('toast.exappr'))},
  async reject(d){const x=DB.expenses.find(y=>y.id===d.id);if(!x||!can('expenses','approve'))return;x.status='Rejected';x.by=user.name;await put('expenses',x);render();toast(T('toast.exrej'))},
  async retire(d){const t=DB.trustees.find(y=>y.id===d.id);if(t&&can('trustees','edit')&&await ask(T('tr.retireconf',{n:loc(t,'name')}),T('btn.retire'))){t.status='Retired';await put('trustees',t);render()}},
  pw(d){const u=DB.users.find(x=>x.id===d.id);if(!u)return;$('#pwd').dataset.id=u.id;$('#pw-t').textContent=u.id===(user&&user.id)&&role()!=='admin'?T('btn.password'):T('pw.for',{n:u.name});$('#pwf').reset();$('#pwErr').textContent='';$('#pwd').showModal()},
  async toggleuser(d){
    const u=DB.users.find(x=>x.id===d.id);if(!u)return;
    if(!u.disabled&&u.role==='admin'&&DB.users.filter(x=>x.role==='admin'&&!x.disabled).length<2){toast(T('us.lastadmin'));return}
    u.disabled=!u.disabled;await put('users',u);render();
  },
  async rmuser(d){
    const u=DB.users.find(x=>x.id===d.id);if(!u)return;
    if(u.role==='admin'&&DB.users.filter(x=>x.role==='admin'&&!x.disabled).length<2){toast(T('us.lastadmin'));return}
    if(await ask(T('us.rmconf',{u:u.username}),T('btn.remove'))){await del('users',u.id);render()}
  },
  async pushdb(){const c=tursoCfg();if(!c||c.readonly){toast(T('db.savetok'));return}
    if(!await ask(T('db.confpush'),T('btn.upload')))return;
    try{setSync('busy','sy.upl');await pushAll(c);setSync('ok','sy.uploaded');toast(T('toast.uploaded'))}catch(e){setSync('bad','sy.uplfail');toast(T('toast.uplfail',{e:e.message}))}},
  async dropdb(){try{localStorage.removeItem(LS_CFG)}catch(e){}setSync('local','sy.local');render();toast(T('toast.disc'))},
  export(){
    const o={};['settings','members','events','donations','trustees','expenses'].forEach(c=>o[c]=DB[c]);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='sapta-kanni-backup-'+todayISO()+'.json';document.body.appendChild(a);a.click();a.remove();
  },
  async reset(){if(await ask(T('bk.resetconf'),T('btn.reset'))){const u=DB.users;DB=seedData();DB.users=u;persistLocal();render();toast(T('toast.reset'))}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t.dataset)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-q]')){view.q=e.target.value;refreshTable()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-fy]')){view.fy=t.value;render()}
  else if(t.matches('[data-st]')){view.st=t.value;refreshTable()}
  else if(t.matches('[data-ev]')){view.ev=t.value;refreshTable()}
  else if(t.matches('[data-font]')){const s=Object.assign({},S());s[t.dataset.font]=t.value;put('settings',s).then(()=>{render();toast(T('toast.applied'))})}
  else if(t.id==='upiQrFile'){const f=t.files&&t.files[0];t.value='';if(f)saveQrImage(f)}
  else if(t.id==='upiFile'||t.id==='upiCap'){const f=t.files&&t.files[0];t.value='';scanFile(f)}
});
$('#dlgf').addEventListener('submit',submitForm);
$('#cam').addEventListener('close',stopCamera);

$('#loginf').addEventListener('submit',async e=>{
  e.preventDefault();$('#loginErr').textContent='';
  await refreshUsers();
  const name=$('#lu').value.trim().toLowerCase(),pw=$('#lp').value;
  const u=DB.users.find(x=>x.username.toLowerCase()===name&&!x.disabled);
  const ok=u&&(await hashes(pw,u.salt)).includes(u.hash);
  if(!ok){$('#loginErr').textContent=T('au.bad');return}
  user=u;try{sessionStorage.setItem(LS_SES,u.id)}catch(err){}
  $('#login').close();toast(T('toast.signedin',{r:tv(ROLE_LABEL[u.role])}));render();
  if(tursoCfg())connectTurso();
});
$('#pwf').addEventListener('submit',async e=>{
  e.preventDefault();
  const a=$('#pw1').value,c=$('#pw2').value,u=DB.users.find(x=>x.id===$('#pwd').dataset.id);
  if(a!==c){$('#pwErr').textContent=T('pw.mismatch');return}
  if(a.length<6){$('#pwErr').textContent=T('pw.short');return}
  if(!u||!(u.id===user.id||user.role==='admin'))return;
  u.salt=uid();u.hash=(await hashes(a,u.salt))[0];u.defaultPw=false;
  await put('users',u);$('#pwd').close();toast(T('toast.pwok'));render();
});
document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.id==='setf'){
    e.preventDefault();const fd=new FormData(f),s=Object.assign({},S());
    ['name','nameTa','blessing','address','addressTa','regNo','prefix','taxNote','upiId','upiName'].forEach(k=>{s[k]=String(fd.get(k)||'').trim()});
    s.upiId=(s.upiId||'').replace(/\s/g,'');
    s.prefix=(s.prefix||'SKA').replace(/[^A-Za-z0-9-]/g,'');
    await put('settings',s);render();toast(T('toast.detsaved'));
  }else if(f.id==='dbf'){
    e.preventDefault();const fd=new FormData(f);
    const url=String(fd.get('url')||'').trim(),token=String(fd.get('token')||'').trim();
    const prev=tursoCfg();
    if(!url||(!token&&!(prev&&!prev.readonly))){toast(T('db.need'));return}
    try{localStorage.setItem(LS_CFG,JSON.stringify({url,token:token||prev.token}))}catch(err){toast(T('db.blocked'));return}
    await connectTurso();
  }else if(f.id==='userf'){
    e.preventDefault();const fd=new FormData(f),un=String(fd.get('username')).trim().toLowerCase(),pw=String(fd.get('password'));
    if(!/^[a-z0-9._-]{3,}$/.test(un)){$('#userErr').textContent=T('us.badname');return}
    if(DB.users.some(x=>x.username.toLowerCase()===un)){$('#userErr').textContent=T('us.taken');return}
    const salt=uid();
    await put('users',{id:uid(),username:un,name:String(fd.get('name')).trim(),role:String(fd.get('role')),salt,hash:(await hashes(pw,salt))[0],defaultPw:false});
    render();toast(T('toast.useradded'));
  }
});

/* ---------- start ---------- */
(async function init(){
  try{const l=localStorage.getItem(LS_LANG);LANG=l==='ta'||l==='en'?l:((navigator.language||'').toLowerCase().indexOf('ta')===0?'ta':'en')}catch(e){}
  DB=readLocal()||seedData();
  const sd=seedData();COLS.forEach(c=>{if(!DB[c])DB[c]=c==='settings'?sd.settings:[]});
  backfill();
  if(!DB.users.length)DB.users=await seedUsers();
  persistLocal();
  try{const sid=sessionStorage.getItem(LS_SES);user=DB.users.find(u=>u.id===sid&&!u.disabled)||null}catch(e){}
  render();
  await connectTurso();
})();
})();
</script>
